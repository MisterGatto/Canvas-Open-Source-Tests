name: Android Release Build

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Release Keystore (from GitHub Secret)
      if: "${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}"
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/canvas-release.jks

    - name: Build Release APK
      env:
        DIST_KS_PASSWORD: ${{ secrets.DIST_KS_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Canvas-Lua-Release
        path: app/build/outputs/apk/release/*.apk

    - name: Generate Release Tag and Name
      id: vars
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${{ github.ref_name }}"
        else
          TAG_NAME="release-${SHORT_SHA}-run${{ github.run_number }}"
        fi
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_name=Canvas Lua ${TAG_NAME}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.vars.outputs.tag_name }}
        name: ${{ steps.vars.outputs.release_name }}
        body: |
          ### Canvas Lua Release
          - **Commit**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **Branch**: `${{ github.ref_name }}`
          - **Run**: #${{ github.run_number }}
          
          Release build compiled and packaged automatically.
        files: app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
